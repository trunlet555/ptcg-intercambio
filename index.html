<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intercambio de Cartas Pokémon — MVP v0.2</title>
  <meta name="description" content="MVP para gestionar listas de cartas BUSCO/TENGO y simular matches para intercambio en físico." />
  <style>
    body { font-family: sans-serif; background:#0f172a; color:#e5e7eb; margin:0; }
    header { background:#111827; padding:1rem; position:sticky; top:0; }
    h1 { margin:0; font-size:1.3rem; }
    .wrap { max-width:960px; margin:0 auto; padding:1rem; }
    .grid { display:grid; gap:1rem; grid-template-columns:1fr; }
    @media(min-width:900px){ .grid{ grid-template-columns:1fr 1fr; } .span-2{grid-column:span 2;} }
    .card { background:#1f2937; border-radius:12px; padding:1rem; }
    .card h2 { margin-top:0; }
    label { font-size:.85rem; color:#94a3b8; display:block; margin-bottom:.2rem; }
    input,select,textarea,button {
      width:100%; padding:.6rem; border-radius:8px; border:1px solid #334155; background:#0b1220; color:#e5e7eb;
    }
    button { cursor:pointer; font-weight:600; }
    .btn.primary { background:#22c55e; color:#06210f; }
    .btn.ghost { background:transparent; border:1px solid #334155; }
    .btn.danger { background:#ef4444; color:#fff; }
    .list { display:grid; gap:.5rem; margin-top:.5rem; }
    .item { display:flex; justify-content:space-between; border:1px dashed #334155; border-radius:8px; padding:.5rem; }
    .pill { background:#0ea5e922; border:1px solid #0ea5e955; border-radius:999px; padding:0 .5rem; font-size:.75rem; }
    .empty { color:#94a3b8; text-align:center; padding:1rem; }
  </style>
</head>
<body>
<header class="wrap"><h1>Intercambio de Cartas Pokémon — MVP v0.2</h1></header>
<main class="wrap">
  <section class="grid">
    <!-- Perfil -->
    <article class="card">
      <h2>Perfil</h2>
      <label>Nombre <input id="name"></label>
      <label>Ciudad <input id="city"></label>
      <label>Idioma <select id="lang"><option>ES</option><option>EN</option><option>DE</option></select></label>
      <label>Contacto <input id="contact"></label>
      <button class="btn primary" id="saveProfile">Guardar</button>
      <button class="btn ghost" id="clearProfile">Vaciar</button>
    </article>

    <!-- Añadir TENGO -->
    <article class="card">
      <h2>Añadir a TENGO</h2>
      <label>Set <input id="haveSet"></label>
      <label>Código <input id="haveCode"></label>
      <label>Nombre <input id="haveName"></label>
      <label>Cantidad <input id="haveQty" type="number" value="1" min="1"></label>
      <label>Estado <select id="haveCond"><option>Near Mint</option><option>Slightly Played</option></select></label>
      <label>Rareza <input id="haveRarity"></label>
      <label>Impresión <input id="havePrint"></label>
      <label>Nota <input id="haveNote"></label>
      <button class="btn primary" id="addHave">Añadir</button>
    </article>

    <!-- Lista TENGO -->
    <article class="card">
      <h2>Mi lista TENGO</h2>
      <input id="searchHave" placeholder="Filtrar...">
      <button class="btn ghost" id="clearHave">Vaciar</button>
      <div id="listHave" class="list"></div>
      <div id="emptyHave" class="empty">Sin cartas.</div>
    </article>

    <!-- Añadir BUSCO -->
    <article class="card">
      <h2>Añadir a BUSCO</h2>
      <label>Set <input id="wantSet"></label>
      <label>Código <input id="wantCode"></label>
      <label>Nombre <input id="wantName"></label>
      <label>Cantidad <input id="wantQty" type="number" value="1" min="1"></label>
      <label>Idioma <select id="wantLang"><option>ANY</option><option>ES</option><option>EN</option></select></label>
      <label>Rareza <input id="wantRarity"></label>
      <label>Impresión <input id="wantPrint"></label>
      <label>Nota <input id="wantNote"></label>
      <button class="btn primary" id="addWant">Añadir</button>
    </article>

    <!-- Lista BUSCO -->
    <article class="card">
      <h2>Mi lista BUSCO</h2>
      <input id="searchWant" placeholder="Filtrar...">
      <button class="btn ghost" id="clearWant">Vaciar</button>
      <div id="listWant" class="list"></div>
      <div id="emptyWant" class="empty">Sin cartas.</div>
    </article>

    <!-- Exportar/Importar -->
    <article class="card span-2">
      <h2>Compartir</h2>
      <button class="btn primary" id="exportAll">Descargar JSON</button>
      <button class="btn ghost" id="copyAll">Copiar JSON</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn ghost" id="importBtn">Importar JSON</button>
      <textarea id="otherJson" placeholder="Pega JSON de otra persona"></textarea>
      <button class="btn primary" id="runMatch">Calcular match</button>
      <div id="matchResults" class="list"></div>
      <div id="emptyMatch" class="empty">Sin resultados.</div>
    </article>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
function uuid(){return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));}

const els={
  name:$('#name'), city:$('#city'), lang:$('#lang'), contact:$('#contact'),
  saveProfile:$('#saveProfile'), clearProfile:$('#clearProfile'),
  haveSet:$('#haveSet'), haveCode:$('#haveCode'), haveName:$('#haveName'), haveQty:$('#haveQty'), haveCond:$('#haveCond'), haveRarity:$('#haveRarity'), havePrint:$('#havePrint'), haveNote:$('#haveNote'), addHave:$('#addHave'),
  wantSet:$('#wantSet'), wantCode:$('#wantCode'), wantName:$('#wantName'), wantQty:$('#wantQty'), wantLang:$('#wantLang'), wantRarity:$('#wantRarity'), wantPrint:$('#wantPrint'), wantNote:$('#wantNote'), addWant:$('#addWant'),
  listHave:$('#listHave'), listWant:$('#listWant'), emptyHave:$('#emptyHave'), emptyWant:$('#emptyWant'),
  searchHave:$('#searchHave'), searchWant:$('#searchWant'), clearHave:$('#clearHave'), clearWant:$('#clearWant'),
  exportAll:$('#exportAll'), copyAll:$('#copyAll'), importBtn:$('#importBtn'), importFile:$('#importFile'),
  otherJson:$('#otherJson'), runMatch:$('#runMatch'),
  matchResults:$('#matchResults'), emptyMatch:$('#emptyMatch')
};

const KEY={profile:'ptcgProfile',have:'ptcgHave',want:'ptcgWant'};
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f;}catch{return f;}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let profile=read(KEY.profile,{name:'',city:'',lang:'ES',contact:''});
let have=read(KEY.have,[]); let want=read(KEY.want,[]);

function persist(t){if(t==='profile')write(KEY.profile,profile);if(t==='have')write(KEY.have,have);if(t==='want')write(KEY.want,want);}
function itemKey(x){return `${x.set||''}:${x.code||''}:${x.name||''}:${x.rarity||''}:${x.printType||''}`;}
function rerender(){els.name.value=profile.name; els.city.value=profile.city; els.lang.value=profile.lang; els.contact.value=profile.contact;
  renderList(els.listHave,els.emptyHave,have,els.searchHave.value,'have');
  renderList(els.listWant,els.emptyWant,want,els.searchWant.value,'want');}
function renderList(el,empty,arr,q,t){el.innerHTML='';q=q.toLowerCase();let f=arr.filter(x=>[x.set,x.code,x.name].some(v=>(v||'').toLowerCase().includes(q)));if(!f.length){empty.hidden=false;return;}empty.hidden=true;
  f.forEach(x=>{let d=document.createElement('div');d.className='item';
    d.innerHTML=`<div><strong>${x.name||'—'}</strong><br><small>${x.set} · <span class="pill">${x.code}</span> · ${x.qty}u ${x.cond||''} ${x.rarity||''} ${x.printType||''} ${x.note||''}</small></div>`;
    let b=document.createElement('button');b.textContent='Eliminar';b.className='btn danger';b.onclick=()=>{arr.splice(arr.indexOf(x),1);persist(t);rerender();};
    d.appendChild(b);el.appendChild(d);});}

els.saveProfile.onclick=()=>{profile={name:els.name.value,city:els.city.value,lang:els.lang.value,contact:els.contact.value};persist('profile');};
els.clearProfile.onclick=()=>{profile={name:'',city:'',lang:'ES',contact:''};persist('profile');rerender();};

els.addHave.onclick=()=>{let o={set:els.haveSet.value,code:els.haveCode.value.toUpperCase(),name:els.haveName.value,qty:+els.haveQty.value,cond:els.haveCond.value,rarity:els.haveRarity.value,printType:els.havePrint.value,note:els.haveNote.value,_id:uuid(),_k:itemKey({set:els.haveSet.value,code:els.haveCode.value,name:els.haveName.value,rarity:els.haveRarity.value,printType:els.havePrint.value})};have.push(o);persist('have');rerender();};
els.addWant.onclick=()=>{let o={set:els.wantSet.value,code:els.wantCode.value.toUpperCase(),name:els.wantName.value,qty:+els.wantQty.value,lang:els.wantLang.value,rarity:els.wantRarity.value,printType:els.wantPrint.value,note:els.wantNote.value,_id:uuid(),_k:itemKey({set:els.wantSet.value,code:els.wantCode.value,name:els.wantName.value,rarity:els.wantRarity.value,printType:els.wantPrint.value})};want.push(o);persist('want');rerender();};

els.clearHave.onclick=()=>{have=[];persist('have');rerender();};
els.clearWant.onclick=()=>{want=[];persist('want');rerender();};
els.searchHave.oninput=()=>rerender(); els.searchWant.oninput=()=>rerender();

els.exportAll.onclick=()=>{let d={profile,have,want};let blob=new Blob([JSON.stringify(d)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ptcg.json';a.click();};
els.copyAll.onclick=()=>{let d={profile,have,want};navigator.clipboard.writeText(JSON.stringify(d,null,2));};
els.importBtn.onclick=()=>els.importFile.click();
els.importFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;let j=JSON.parse(await f.text());if(j.profile)profile=j.profile;if(j.have)have=j.have;if(j.want)want=j.want;persist('profile');persist('have');persist('want');rerender();};

els.runMatch.onclick=()=>{let other=JSON.parse(els.otherJson.value||'{}');let iGive=have.filter(h=>other.want?.some(w=>w._k===h._k));let iReceive=want.filter(w=>other.have?.some(h=>h._k===w._k));els.matchResults.innerHTML=`<div>Yo doy: ${iGive.length} · Recibo: ${iReceive.length}</div>`;};

rerender();
</script>
</body>
</html>
